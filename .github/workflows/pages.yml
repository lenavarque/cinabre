name: Example pages

# Publishes the example timelines (demo/, exported read-only from Cinabre) on GitHub Pages: in English at the root
# (world history) and in /revolution/, in French under /fr/ and /fr/revolution/
# (repository setting: Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Example pages
        run: |
          mkdir -p _site/revolution _site/fr/revolution
          cp demo/en/histoire.html _site/index.html
          cp demo/en/revolution.html _site/revolution/index.html
          cp demo/fr/histoire.html _site/fr/index.html
          cp demo/fr/revolution.html _site/fr/revolution/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
