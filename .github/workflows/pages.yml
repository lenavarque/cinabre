name: Démonstration

# Publie les deux frises de démonstration (demo/, exportées depuis Cinabre, en lecture seule) sur GitHub Pages :
# l'histoire universelle à la racine, la Révolution française dans /revolution/ (réglage du dépôt :
# Settings → Pages → Source : GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pages de démonstration
        run: |
          mkdir -p _site/revolution
          cp demo/histoire.html _site/index.html
          cp demo/revolution.html _site/revolution/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
