 d'Homère","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Pensée et lettres"]}]},{"date":"- 745","annee":-745,"evenements":[{"label":"Teglath-Phalasar III","groupes":["Mésopotamie"],"limite":null,"regne":true,"comment":"Roi d'Assyrie et de Babylone, il prend le pouvoir certainement par un coup d'État alors que les précédents rois Assyriens perdaient en pouvoir et voyaient de plus en plus de menaces sur leurs frontières. Tiglath-Phalazar III règle les problèmes sociaux et militaires et agrandi son empire.","themes":["Pouvoir et politique"]}]},{"date":"- 716","annee":-716,"evenements":[{"label":"Bakenranef (XXIV)","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":"Basé à Saïs dans l'ouest du Delta, il a gouverné la Basse-Égypte à partir d'environ -725 à -720. Chabataka, un koushite, roi de la XXVe dynastie, exécuta Bakenrenef en le faisant brûler vif.","themes":["Pouvoir et politique"]},{"label":"Chabaka","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":null,"themes":["Pouvoir et politique"]}]},{"date":"- 700","annee":-700,"evenements":[{"label":"Rédaction de l'Odyssée","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Pensée et lettres"]},{"label":"Âge de fer en France","groupes":["Europe"],"limite":null,"regne":false,"comment":null,"themes":["Sciences et techniques"]}]},{"date":"- 668","annee":-668,"evenements":[{"label":"Assurbanipal","groupes":["Mésopotamie"],"limite":null,"regne":true,"comment":"Dernier grand souverain de l'Assyrie antique, la sculpture assyrienne atteignit son apogée sous son règne. Pour les Grecs, il était le symbole d'un homme puissant menant une vie luxueuse et dissolue.","themes":["Pouvoir et politique"]}]},{"date":"- 664","annee":-664,"evenements":[{"label":"Tanoutamon (XXV)","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":"Tanoutamon est le dernier pharaon de la XXVe dynastie, couronné dans le temple d'Amon du Gebel Barkal. Il est roi de Napata et pharaon de -664 à -656. Il reprend la lutte pour concrétiser le rêve de son père et s'engage immédiatement dans une campagne militaire contre les souverains rebelles du Nord, dont le roi de Saïs Nékao Ier mis en place par les Assyriens. Il assiège et prend Memphis et Nékao Ier meurt au cours de la bataille. Le roi Assyrien Assurbanipal renprend la ville quelques années plus tard. Ses descendants sont à l'origine des pharaons de Napata et de la civilisation méroïtique.","themes":["Pouvoir et politique"]}]},{"date":"- 632","annee":-632,"evenements":[{"label":"Bataille de Chengpu","groupes":["Chine"],"limite":null,"regne":false,"comment":"La bataille de Chengpu est la première bataille de l'histoire chinoise décrite avec précision. Le Zuo Zhuan comprend en effet la description détaillée de la stratégie militaire utilisée, avec notamment des stratégies comme « attaquer des deux côtés » et « attirer l’ennemi vers soi ». L’État de Chu attaque l’État de Song, alliée de l’État de Jin sur lequel règne le duc Jin Wen Gong. Dans le même temps, la principauté de Chu s’allie avec les États de Cao et de Wei. La victoire Jin est écrasante mais l’État de Chu va tout de même devenir la puissance incontestée du sud de la Chine pendant la période des Printemps et des Automnes et la période des Royaumes combattants.","themes":["Guerres et conflits"]}]},{"date":"- 580","annee":-580,"evenements":[{"label":"Naissance de Pythagore","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Pensée et lettres","Sciences et techniques"]}]},{"date":"- 566","annee":-566,"evenements":[{"label":"Fondation des Panathénées","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Religion et croyances"]}]},{"date":"- 551","annee":-551,"evenements":[{"label":"Naissance de Confiucius","groupes":["Chine"],"limite":null,"regne":false,"comment":"Confucius est un philosophe chinois, le personnage historique qui a le plus marqué la civilisation chinoise, et est considéré comme le premier « éducateur » de la Chine. Son enseignement a donné naissance au confucianisme, doctrine politique et sociale érigée en religion d'État dès la dynastie Han et qui ne fut officiellement bannie qu'au début du xxe siècle, avec une résurgence en 1973. Ce courant de pensée repose essentiellement sur des préceptes défendant une morale humaniste sans recours à une métaphysique.","themes":["Pensée et lettres"]}]},{"date":"- 550","annee":-550,"evenements":[{"label":"Fondation de la Ligue du Péloponnèse","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Guerres et conflits","Droit et diplomatie"]}]},{"date":"- 525","annee":-525,"evenements":[{"label":"Cambyse II (XXVII)","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":"Grand roi achéménide de l'empire perse de 529 à sa mort en 522 av. J.-C., il est connu pour avoir conquis l'Égypte et y avoir régné en premier pharaon perse.","themes":["Pouvoir et politique"]}]},{"date":"- 509","annee":-509,"evenements":[{"label":"République","groupes":["Rome"],"limite":"debut","regne":false,"comment":"Tarquin le Superbe roi de Rome et sa famille sont bannis du royaume, la République est fondé par Lucius Junius Brutus, l'un des deux premiers consuls de Rome. La République prend fin en -27","themes":["Pouvoir et politique"]}]},{"date":"- 508","annee":-508,"evenements":[{"label":"Démocratie","groupes":["Grèce Antique"],"limite":"debut","regne":false,"comment":"En -510, les Spartiates mettent fin à la tyranie à Athènes ; en -508, la démocratie est proclamée contre l'avis des Spartiates","themes":["Pouvoir et politique","Droit et diplomatie"]}]},{"date":"- 500","annee":-500,"evenements":[{"label":"Naissance de Lao Tseu ~","groupes":["Chine"],"limite":null,"regne":false,"comment":"Lao Tseu aurait été un sage chinois et, selon la tradition, un contemporain de Confucius (né 50 ans plus tard. Il est considéré a posteriori comme le père fondateur du taoïsme, l'un des trois piliers de la pensée chinoise avec le confucianisme et le bouddhisme.","themes":["Pensée et lettres"]},{"label":"Fin de la domination Olmèque","groupes":["Amérique"],"limite":null,"regne":false,"comment":null,"themes":["Civilisations","Pouvoir et politique"]}]},{"date":"- 490","annee":-490,"evenements":[{"label":"Bataille de Marathon","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"13 septembre, 1ère guerre médique, victoire d'Athènes sur les Perses","themes":["Guerres et conflits"]}]},{"date":"- 480","annee":-480,"evenements":[{"label":"Ère classique","groupes":["Grèce Antique"],"limite":"debut","regne":false,"comment":null,"themes":["Civilisations"]},{"label":"Bataille des Thermopyles","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"11 août, 2ème guerre médique, victoire des Perses sur les Grecs","themes":["Guerres et conflits"]},{"label":"Bataille de Salamine","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"29 septembre, 2ème guerre médique, victoire décisive des Grecs sur les Perses","themes":["Guerres et conflits"]}]},{"date":"- 478","annee":-478,"evenements":[{"label":"Fondation de la Ligue de Délos","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Guerres et conflits","Droit et diplomatie"]}]},{"date":"- 470","annee":-470,"evenements":[{"label":"Naissance de Socrate","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Pensée et lettres"]}]},{"date":"- 460","annee":-460,"evenements":[{"label":"Première Guerre du Péloponnèse","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Guerre de -460 à -445, oppose la Ligue de Délos dirigée par Athènes et Argos à la Ligue du Péloponnèse dirigée par Sparte et Thèbes. Victoire de Sparte, Mégare est rendue à la Ligue du Péloponnèse.","themes":["Guerres et conflits"]}]},{"date":"- 451","annee":-451,"evenements":[{"label":"Loi de Douze Tables","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"La loi des Douze Tables constitue le premier corpus de lois romaines écrites. Leur rédaction est l'acte fondateur du ius scriptum, le droit écrit. Le corpus est rédigé par un collège de décemvirs entre 451 et 449. Insufflé par le tribun de la plèbe Caius Terentilius Harsa et sa Lex Terentilia visant à limiter les pouvoirs arbitraires des consuls en s'inspirant de la démocratie Athénienne.","themes":["Droit et diplomatie"]}]},{"date":"- 450","annee":-450,"evenements":[{"label":"Construction de l'Acropole à Athènes","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Début des travaux ordonnés par Péricles","themes":["Religion et croyances","Arts et architecture"]}]},{"date":"- 443","annee":-443,"evenements":[{"label":"Première guerre samnite","groupes":["Rome"],"limite":null,"regne":false,"comment":"Début de l'expension de Rome, victoire militaire romaine non décisive, renouvellement du pacte d'alliance et d'amitié romano-samnite. Fin en -341.","themes":["Guerres et conflits"]}]},{"date":"- 441","annee":-441,"evenements":[{"label":"Deuxième Guerre du Péloponnèse","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"De -441 à -404, la Ligue du Péloponnèse remporte la guerre et dissout la Ligue de Délos.","themes":["Guerres et conflits"]}]},{"date":"- 430","annee":-430,"evenements":[{"label":"Épidémie de peste à Athènes","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Catastrophes"]}]},{"date":"- 404","annee":-404,"evenements":[{"label":"Les Trente à Athènes","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Suite à la défaite d'Athènes lors de la seconde Guerre du Péloponnèse, un coup d'État oligarchique est fomenté, c'est la fin d'Athènes, de sa démocratie et de son indépendance","themes":["Pouvoir et politique"]}]},{"date":"- 403","annee":-403,"evenements":[{"label":"Période des Royaumes combattants","groupes":["Chine"],"limite":"debut","regne":false,"comment":"La période des Royaumes combattants s'étend de -403 à -221. Cette dernière période de l'ère pré-impériale voit le déclin de la dynastie Zhou et le renforcement du pouvoir des princes. Les Chu, Han, Qi, Qin, Wei, Yan et Zhao s'affranchissent définitivement de la tutelle symbolique des Zhou, leur souverins sont des rois (wang). Ils se livrent des guerres incessantes qui apportent de nombreux progrès dirigés par une administration centralisée.","themes":["Pouvoir et politique","Guerres et conflits"]}]},{"date":"- 400","annee":-400,"evenements":[{"label":"Rome compte 30 000 habitants","groupes":["Rome"],"limite":null,"regne":false,"comment":null,"themes":["Villes et fondations","Économie et société"]}]},{"date":"- 390","annee":-390,"evenements":[{"label":"Sac de Rome","groupes":["Rome"],"limite":null,"regne":false,"comment":"pillage de Rome par les Celtes","themes":["Guerres et conflits"]}]},{"date":"- 384","annee":-384,"evenements":[{"label":"Naissance d'Aristote","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":null,"themes":["Pensée et lettres"]}]},{"date":"- 380","annee":-380,"evenements":[{"label":"Nectanébo I (XXX)","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":"Nectanébo Ier (Khéperka Rê) est un des derniers Égyptiens ethniques sur le trône d'Égypte. Il fut un grand constructeur ou reconstructeur des principaux temples d'une Égypte réunifiée pour la dernière fois par des souverains d'origine locale. Il intervint à Héliopolis en embellissant le sanctuaire du dieu Rê. Des lions couchés à son nom qui sont aujourd'hui à Rome où ils avaient été importés pour le temple d'Isis de la capitale impériale, devaient alors initialement orner l'entrée d'un des sanctuaires de la ville du soleil, continuant ainsi l'œuvre de ses prédécesseurs et se rattachant davantage encore à la tradition saïte.","themes":["Pouvoir et politique"]}]},{"date":"- 360","annee":-360,"evenements":[{"label":"Nectanébo II (XXX)","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":"Nectanébo II (règne de -360 à -343) est le troisième et dernier pharaon de la XXXe dynastie et ainsi le dernier souverain égyptien indépendant. Il se voit offrir la couronne avec l'aide du roi de Sparte Agésilas II, laissant Téos aux prises avec les Perses. Sous son règne l’Égypte vit ses dernières années de paix et pendant dix-huit années il réussit à éloigner la menace toujours présente de l'invasion perse en remportant une bataille en -351. Ce répit de courte durée permet à Nectanébo II de continuer l'œuvre de son grand-père Nectanébo Ier.","themes":["Pouvoir et politique"]}]},{"date":"- 356","annee":-356,"evenements":[{"label":"Naissance d’Alexandre le Grand","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"21 Juillet -356","themes":["Pouvoir et politique"]}]},{"date":"- 336","annee":-336,"evenements":[{"label":"Darius III (XXXI)","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":null,"themes":["Pouvoir et politique"]}]},{"date":"- 334","annee":-334,"evenements":[{"label":"Bataille du Granique","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"En mai -334, première bataille contre les Perses, victoire des Macédoniens et des Grecs (37 000 hommes dont 5 000 cavaliers) contre les satrapes perses : Spithridatès, Mithridate, Arsamès et Memnon de Rhodes et leur armée (40 000 fantassins dont 10 000 mercenaires Grecs). Les pertes sont de 300 hommes côté grec contre 12 000 côté perse. Cette victoire ouvre les portes de l'Asie Mineure.","themes":["Guerres et conflits"]}]},{"date":"- 333","annee":-333,"evenements":[{"label":"Bataille d’Issos","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Le 12 novembre -334, l'armée macédonienne remporte une victoire décisive sur l'armée perse commandée par Darius en personne. Cette bataille voit la victoire d'Alexandre qui peut poursuivre sa conquête vers la Phénicie puis l'Égypte. 700 des 40 000 soldats Grecs périssent contre 20 000 des   80 000 soldats de l'armée perse.","themes":["Guerres et conflits"]}]},{"date":"- 332","annee":-332,"evenements":[{"label":"Alexandre le Grand","groupes":["Grèce Antique","Mésopotamie","Égypte Antique"],"limite":null,"regne":true,"comment":null,"themes":["Pouvoir et politique"]}]},{"date":"- 331","annee":-331,"evenements":[{"label":"Bataille de Gaugamèles","groupes":["Grèce Antique","Mésopotamie"],"limite":null,"regne":false,"comment":"La bataille du 1er octobre -331 est l'affrontement décisif entre l'armée d'Alexandre le Grand et celle de Darius III. Lors de cette bataille, considérée comme l'une des plus importantes de l'Antiquité par les forces impliquées, le royaume de Macédoine vainc définitivement l'Empire perse. Les 40 000 hommes (35 000 fantassins et 5 000 cavaliers) d'Alexandre perdent 500 hommes alors que les troupes de Darius III, Bessos (Artaxerxès V) et Mazaios (ce dernier qui se ralie finalement à Alexandre et devient le satrape de Babylonie) ont 230 000 fantassins, 15 000 cavaliers, 200 chars à faux et 15 éléphants de guerre (chiffre discuté).","themes":["Guerres et conflits"]}]},{"date":"- 327","annee":-327,"evenements":[{"label":"Deuxième guerre samnite","groupes":["Rome"],"limite":null,"regne":false,"comment":"Malgrès de nombreuses défaites, Rome prend les principales villes samnites. La victoire militaire romaine est non décisive, le pacte d'alliance et d'amitié romano-samnite est renouvellé.","themes":["Guerres et conflits"]}]},{"date":"- 326","annee":-326,"evenements":[{"label":"Bataille de Jhelum","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"juillet -326, victoire des Macédoniens sur le raja indien Pûru","themes":["Guerres et conflits"]}]},{"date":"- 323","annee":-323,"evenements":[{"label":"Mort d’Alexandre le Grand","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"11 juin -323, à 32 ans","themes":["Pouvoir et politique"]},{"label":"Accords de Babylone","groupes":["Grèce Antique","Mésopotamie"],"limite":null,"regne":false,"comment":"• Ptolémée reçoit l'Égypte, la satrapie la plus riche et la plus peuplée, pour laquelle il a des ambitions depuis longtemps\n• Antigone est confirmé à la tête de la Phrygie qu'il gouverne depuis 333 et obtient en plus la Lycie et la Pamphylie\n• Lysimaque reçoit la Thrace, prise à Antipater, où il se rend rapidement pour faire face à des révoltes\n• Léonnatos reçoit la Phrygie hellespontique\n• Peithon reçoit la Médie\n• Peucestas reçoit la Perside\n• Philotas reçoit la Cilicie\n• Archon reçoit la Babylonie\n• Asandros reçoit la Carie\n• Atropatès, un des rares Asiatiques à rester en poste, conserve la Petite Médie, qui prend le nom de Médie « Atropatène »\n• Eumène de Cardia reçoit la Cappadoce et la Paphlagonie, à condition de les conquérir car ces deux territoires n'ont pas été soumis par Alexandre","themes":["Droit et diplomatie"]}]},{"date":"- 322","annee":-322,"evenements":[{"label":"Première guerre des Diadoques","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"De -322 à -319, la guerre pour le partage de l'empire commence.\n• 322 : Antipater et Cratère signent une alliance avec Ptolémée, qui se retrouve en guerre contre Perdiccas\n• 321 : Cratère essaie de prendre l'Anatolie mais meurt en perdant contre Perdiccas, ce dernier se fait assassiner par ses officiers dont Séleucos alors qu'il combat Ptolémée ; de ces deux morts débouchent les Accords de Triparadisos, qui favorise Antipater soutenu par Antigone et Séleucos\n• 320 : Antigone bat les derniers partisans de Perdiccas\n• 319 : Antipater meurt de vieillesse à 78 ans, Cassandre reprendra la régence de la Macédoine en -317","themes":["Guerres et conflits"]},{"label":"Guerre lamiaque","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Les cités grecques se rebellent mais les Macédoniens commandés par Antipater et Cratère les écrasent, Léonnatos trouve la mort","themes":["Guerres et conflits"]}]},{"date":"- 311","annee":-311,"evenements":[{"label":"Guerre babylonienne","groupes":["Grèce Antique","Mésopotamie"],"limite":null,"regne":false,"comment":"Séleucos repousse Antigone et Démétrios en 309 durant la guerre babylonienne et étend son gouvernement vers toutes les Hautes satrapies (Perside, Susiane, Médie, Arie, Drangiane, etc.) et jusqu'à l'Inde atteinte en 308, où il signe un traité de paix avec Chandragupta. Ptolémée agrandit son empire alors que Démétrios est occupé de nouveau contre Séleucos et qu'Antigone n'a plus de flotte. Antigone fait assassiner Cléopatre en -309, la soeur d'Alexandre, pour éviter que la Grèce tombe aux mains de Ptolémée avec qui il est en guerre, c'est la fin des Argéade. Antigone fait signer à Démétrios un accord de partage de la mer Egée avec Ptolémée pour éviter que ces territoires ne reviennent à Cassandre.","themes":["Guerres et conflits"]}]},{"date":"- 308","annee":-308,"evenements":[{"label":"Proclamation royale des Diadoques","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Ptolémée se retire de Grèce, territoire repris par Antigone qui avait traité avec Séleucos à l'issue de la guerre babylonienne. Démétrios construit une flotte de 250 navires et entre dans Athènes en libérateur, chassant alors Cassandre. Antigone cherche à envahir l'Egypte mais échoue en -306. Démétrios fils d'Antigone est proclamé basileus dans l'année, suivi par les autres grands diadoques en -305 pendant l'année des rois : Ptolémée puis Cassandre, Lysimaque et Séleucos Ier suivent.","themes":["Pouvoir et politique"]}]},{"date":"- 305","annee":-305,"evenements":[{"label":"Siège de Rhodes","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Antigone veut une plus grande maitrise des mers, Démétrios assiège donc la ville pendant un an et la prend alors qu'elle est soutenu par Ptolémée, Cassandre et Lysimaque. Rhodes s'engage finalement à devenir l'alliée d'Antigone, sauf contre l'Égypte. Ce moment est comémoré par l'érection du Colosse en -292.","themes":["Guerres et conflits"]},{"label":"Ptolémée Ier (XXXIII)","groupes":["Égypte Antique","Grèce Antique"],"limite":null,"regne":true,"comment":null,"themes":["Pouvoir et politique"]}]},{"date":"- 304","annee":-304,"evenements":[{"label":"Troisième Guerre des Diadoques","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Ptolémée, Séleucos, Cassandre et Lysimaque forment une coalition pour essayer de limiter l'influance d'Antigone le Borgne en Grèce. À l'issue de la bataille d'Ipsos, les vainqueurs se partagent le royaume d'Antigone : Ptolémée prend la Syrie et la côte sud de l'Anatolie, Cassandre s'affirme en Macédoine et en Grèce, Lysimaque domine la Thrace et l'Anatolie et Séleucos, le grand vainqueur, s'empare de tout le reste de l'empire d'Antigone en plus du sien qui s'étend jusqu'en Inde.","themes":["Guerres et conflits"]}]},{"date":"- 301","annee":-301,"evenements":[{"label":"Bataille d'Ipsos","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Les derniers Diadoques se retrouvent en Phyrgie pour leur dernière bataille, la victoire est pour les Macédoniens et les Séleucides (64 000 fantassins, 10 500 cavaliers, 400 éléphants, 120 chars) contre les Aitigonides (70 000 fantassins, 10 000 cavaliers, 75 éléphants d'Asie)","themes":["Guerres et conflits"]},{"label":"Fin de la civilisation phénicienne","groupes":["Phénicie"],"limite":null,"regne":false,"comment":null,"themes":["Civilisations"]}]},{"date":"- 298","annee":-298,"evenements":[{"label":"Troisième guerre samnite","groupes":["Rome"],"limite":null,"regne":false,"comment":"Fin en -290, se conclue par une victoire militaire romaine décisive, les peuples d'Italie centrale son soumis et l'Étrurie est sous domination romaine.","themes":["Guerres et conflits"]}]},{"date":"- 283","annee":-283,"evenements":[{"label":"Mort des derniers diadoques","groupes":["Grèce Antique"],"limite":null,"regne":false,"comment":"Ptolémée meurt de vieillesse en -283, Lysimaque périt contre Séleucos lors de la bataille de Couroupédion en -281, suivit par Séleucos dans l'été qui est assassiné par le fils de Ptolémée pour avoir rompu ses promesses de paix.","themes":["Pouvoir et politique"]}]},{"date":"- 270","annee":-270,"evenements":[{"label":"Rome compte 270 000 habitants","groupes":["Rome"],"limite":null,"regne":false,"comment":null,"themes":["Villes et fondations","Économie et société"]}]},{"date":"- 264","annee":-264,"evenements":[{"label":"Première guerre punique","groupes":["Rome","Phénicie"],"limite":null,"regne":false,"comment":"La première guerre punique ou guerre de Sicile est la première des trois guerres qui opposent Rome et Carthage de -264 à -241. Rome devient une grande puissance navale en Méditérannée, gagne la guerre et prend la Sicile. Les carthaginois gardent un sentiment de revenche.","themes":["Guerres et conflits"]},{"label":"Premiers combats de Gladiateurs","groupes":["Rome"],"limite":null,"regne":false,"comment":null,"themes":["Économie et société"]}]},{"date":"- 260","annee":-260,"evenements":[{"label":"Bataille de Changping","groupes":["Chine"],"limite":null,"regne":false,"comment":"La bataille de Changping, en -260, fut une victoire décisive de l'État de Qin sur l'État de Zhao. Elle voit 450 000 Zhao (450 000 morts) affronter 500 000 Qin (250 000 morts) et se termine par le siège de la forteresse des Zhao. La légende dit que 400 000 Zhao furent enterrés vivants.","themes":["Guerres et conflits"]}]},{"date":"- 256","annee":-256,"evenements":[{"label":"Destitution de Nanwang, dernier Zhou","groupes":["Chine"],"limite":null,"regne":false,"comment":"Le roi Nan n'avait plus de pouvoir exécutif, ni de pouvoir législatif. Son rôle fut réduit à un rôle religieux. Les rituels étaient généralement exécutés pour favoriser les récoltes, mais toutes sortes d'autres rituels ne pouvaient être exécutés que par le souverain légitime et c'est pour cela que le rôle du roi Zhou revêtait une grande importance religieuse. Cependant, celui-ci ne recevait désormais plus les hommages ni les tributs de ses vassaux. Malgrès son grand talent politique, son territoire fu envahi par les Qin.","themes":["Pouvoir et politique"]}]},{"date":"- 250","annee":-250,"evenements":[{"label":"Début de Nazca","groupes":["Amérique"],"limite":null,"regne":false,"comment":null,"themes":["Civilisations"]}]},{"date":"- 247","annee":-247,"evenements":[{"label":"Qin Shi Huang","groupes":["Chine"],"limite":null,"regne":true,"comment":"Qin Shi Huang mit fin à la période féodale en conquérant un à un l'ensemble des Royaumes combattants entre -230 et -221. et devint l'unificateur de l'Empire de Chine, et par conséquent l'empereur fondateur de la dynastie Qin (-221 à -207). Il standardisa l'écriture, la langue, la monnaie, les poids et les mesures et est vu comme le père de la Grande Muraille de Chine. Pourtant, si son œuvre posa les bases de la période impériale chinoise, c'est pour le caractère cruel et autoritaire de son règne inspiré par la philosophie légiste que l'on se souvient surtout de lui. Sa dynastie lui survécut moins de trois ans, à la suite de quoi le pays replongea dans une guerre civile que seul le fondateur de la dynastie Han parvint finalement à éteindre.","themes":["Pouvoir et politique"]}]},{"date":"- 221","annee":-221,"evenements":[{"label":"Chine impériale","groupes":["Chine"],"limite":"debut","regne":false,"comment":"La Chine impériale dure jusqu'au début du xxe siècle. Après des décennies de décadence à la fin de la dynastie Qing, la révolution chinoise de 1911 porte un coup fatal au système impérial et la République de Chine est officiellement proclamée le 1er janvier 1912. La République se maintient jusqu'en 1949 malgré une tentative de restauration en 1915-1916, qui visait à établir une nouvelle dynastie, dite Hongxian.","themes":["Pouvoir et politique"]},{"label":"Fin de la période des Royaumes combattants","groupes":["Chine"],"limite":null,"regne":false,"comment":null,"themes":["Pouvoir et politique","Guerres et conflits"]}]},{"date":"- 218","annee":-218,"evenements":[{"label":"Deuxième guerre punique","groupes":["Rome","Phénicie"],"limite":null,"regne":false,"comment":"Hannibal franchit les Alpes et menace Rome, Hannibal est finalement battu par Scipion l'Africain à la bataille de Zama. Carthage est vaincue jusqu'en Afrique. La guerre prend fin en -201.","themes":["Guerres et conflits"]}]},{"date":"- 216","annee":-216,"evenements":[{"label":"Bataille de Cannes","groupes":["Rome","Phénicie"],"limite":null,"regne":false,"comment":"Le 2 aout -216, l'armée de Carthage dirigée par Hannibal Barca rallié aux Celtes, aux Numides et aux Ibères (50 000 hommes) défait une armée de la République romaine bien plus nombreuse (80 000 hommes, 8 légions + 8 légions alliées) sous le commandement des consuls Caius Terentius Varro et Lucius Æmilius Paullus.","themes":["Guerres et conflits"]}]},{"date":"- 210","annee":-210,"evenements":[{"label":"Enterrement de l'Armée de Xi'an","groupes":["Chine"],"limite":null,"regne":false,"comment":"L'armée de terre cuite (« figurines de guerriers et de chevaux enterrés avec les morts »), ou armée d'argile, est un ensemble de près de huit mille statues de soldats et chevaux en terre cuite, représentant les troupes de Qin Shi Huang, le premier empereur de Chine. Elles ont été enterrées dans les fosses du mausolée de l'empereur Qin, à proximité de la ville de Xi'an, dans le Shaanxi. Cette « armée enterrée », dont les statues ont quasiment toutes un visage différent, était destinée à protéger l'empereur défunt. Elle a été décpuvrete en 1974 par des agriculteurs.","themes":["Religion et croyances","Arts et architecture"]}]},{"date":"- 206","annee":-206,"evenements":[{"label":"Han Gaozu, premier Han","groupes":["Chine"],"limite":"debut","regne":false,"comment":"L’empereur Gaozu des Han est avec Zhu Yuanzhang, fondateur des Ming, l’un des rares empereurs issus de la classe populaire. Il s’est élevé jusqu’au pouvoir suprême en participant à la rébellion contre la dynastie Qin. Son titre de Gaozu (haut ancêtre) semble être une création de Sima Qian qui sera reprise par les historiens ultérieurs.","themes":["Pouvoir et politique"]},{"label":"Guerre Chu-Han","groupes":["Chine"],"limite":null,"regne":false,"comment":"La guerre Chu-Han (206 - 202 av. J.-C) est une période de troubles survenue en Chine entre la fin de la dynastie Qin et le début de la dynastie Han. Xiang Yu, général Qin, partage l'empire en 18 Royaumes, il dirige le royaume du Chu occidental et a pour principal rival Liu Bang dit Gaozu qui dirige le royaume des Han. En -202, la victoire des Han est totale.","themes":["Guerres et conflits"]}]},{"date":"- 202","annee":-202,"evenements":[{"label":"Bataille de Zama","groupes":["Rome","Phénicie"],"limite":null,"regne":false,"comment":"Scipion l'Africain et ses 34 000 légionnaires, 3 000 cavaliers romains et 6 000 cavaliers numides bat Hannibal et ses 50 000 fantassins,   4 000 cavaliers, 80 éléphants de guerre. La moitié de son armée meurt et le quart est réduit en esclavage.","themes":["Guerres et conflits"]}]},{"date":"- 149","annee":-149,"evenements":[{"label":"Troisième guerre punique","groupes":["Rome","Phénicie"],"limite":null,"regne":false,"comment":"Massinissa, roi Numide ayant soutenu Rome durant la Deuxième Guerre Punique, provoque Cartage alors en pleine croissance. De -149 à -146 Rome marche sur Carthage, la ville est rasée (\"Carthago delenda est\" - Caton l'Ancien), Rome domine la Méditerranée occidentale, le reste de l'empire vaincu intègre les territoires de la République.","themes":["Guerres et conflits"]}]},{"date":"- 115","annee":-115,"evenements":[{"label":"Guerre des Cimbres et des Teutons","groupes":["Rome"],"limite":null,"regne":false,"comment":"Après une très lourde défaite de Romains à la bataille d'Arausio en     -105, les romains défont finalement les Germains lors de bataille d'Aquae Sextiae en -102.","themes":["Guerres et conflits"]}]},{"date":"- 107","annee":-107,"evenements":[{"label":"Réforme marianique","groupes":["Rome"],"limite":null,"regne":false,"comment":"Ensemble de changements qui auraient été introduits dans l'armée romaine par le consul Caius Marius à partir de 107.","themes":["Pouvoir et politique","Guerres et conflits"]}]},{"date":"- 105","annee":-105,"evenements":[{"label":"Bataille d'Arausio","groupes":["Rome"],"limite":null,"regne":false,"comment":"La bataille d'Arausio ou bataille d'Orange est une victoire décisive des Cimbres et des Teutons contre les Romains à 200 000 (15 000 morts) contre 120 000 (80 000 morts)","themes":["Guerres et conflits"]}]},{"date":"- 102","annee":-102,"evenements":[{"label":"Bataille d'Aquae Sextiae","groupes":["Rome"],"limite":null,"regne":false,"comment":"Marius écrase les Teutons et les Ambrons près d'Aix-en-Provence avec ses 40 000 hommes (six légions avec cavalerie et auxiliaires) contre 110 000 Germains (80 000 tués et 20 000 prisonniers)","themes":["Guerres et conflits"]}]},{"date":"- 100","annee":-100,"evenements":[{"label":"Fondation de Teotihuacan","groupes":["Amérique"],"limite":null,"regne":false,"comment":null,"themes":["Civilisations","Villes et fondations"]}]},{"date":"- 91","annee":-91,"evenements":[{"label":"Guerre Sociale","groupes":["Rome"],"limite":null,"regne":false,"comment":"Le tribun de la plèbe Marcus Livius Drusus essaye de faire des réformes agraires mais il est assassiné, c'est le début de la guerre civile dite \"guerre sociale\". Elle se solde en -81 par l'obtention de citoyenneté romaine par les habitants de la péninsule.","themes":["Guerres et conflits"]}]},{"date":"- 88","annee":-88,"evenements":[{"label":"Première guerre civile","groupes":["Rome"],"limite":null,"regne":false,"comment":"Victoire de Sylla et de ses partisans contre les forces de Caius Marius","themes":["Guerres et conflits"]}]},{"date":"- 83","annee":-83,"evenements":[{"label":"Guerre sertorienne","groupes":["Rome"],"limite":null,"regne":false,"comment":"Guerre entre Rome et les provinces d'Hispanie sous le commandement de Quintus Sertorius, partisans de Caius Marius, qui s'achève en -72 par la victoire de Pompée le Grand.","themes":["Guerres et conflits"]}]},{"date":"- 82","annee":-82,"evenements":[{"label":"Seconde guerre civile","groupes":["Rome"],"limite":null,"regne":false,"comment":"Seconde guerre civile entre les partisans de Sylla et de Marius, Sylla gagne et se fait élire dictateur à vie.","themes":["Guerres et conflits"]}]},{"date":"- 73","annee":-73,"evenements":[{"label":"Révolte de Spartacus","groupes":["Rome"],"limite":null,"regne":false,"comment":null,"themes":["Guerres et conflits"]}]},{"date":"- 63","annee":-63,"evenements":[{"label":"Conjuration de Catilina","groupes":["Rome"],"limite":null,"regne":false,"comment":"Conjuration visant à renverser le Sénat Romain écrasée par Cicéron pendant son consulat","themes":["Pouvoir et politique"]}]},{"date":"- 60","annee":-60,"evenements":[{"label":"Premier triumvirat","groupes":["Rome"],"limite":null,"regne":false,"comment":"Pompée, Crassus et César forment secrètement le premier triumvirat, une alliance politique privée.","themes":["Pouvoir et politique"]}]},{"date":"- 58","annee":-58,"evenements":[{"label":"Campagne en Gaule","groupes":["Rome","Europe"],"limite":null,"regne":false,"comment":"Campagne de César en Gaule se terminant en -52 par la prise d'Alesia","themes":["Guerres et conflits"]}]},{"date":"- 52","annee":-52,"evenements":[{"label":"Consulat de Pompée","groupes":["Rome"],"limite":null,"regne":false,"comment":null,"themes":["Pouvoir et politique"]}]},{"date":"- 51","annee":-51,"evenements":[{"label":"Cléopâtre VII (XXXIII)","groupes":["Égypte Antique"],"limite":null,"regne":true,"comment":null,"themes":["Pouvoir et politique"]},{"label":"Ptolémée XIII (XXXIII)","groupes":["Égypte Antique","Grèce Antique"],"limite":null,"regne":true,"comment":null,"themes":["Pouvoir et politique"]}]},{"date":"- 49","annee":-49,"evenements":[{"label":"Guerre Civile de César","groupes":["Rome"],"limite":null,"regne":false,"comment":"Guerre civile entre César et Pompée. César franchit le Rubicon, marche sur Rome contre la faction conservatrice du Sénat romain, les optimates, épaulée par les légions de Pompée. Il obtient une victoire décisive et établit la dictature en -45.","themes":["Guerres et conflits"]}]},{"date":"- 44","annee":-44,"evenements":[{"label":"Assassinat de Jules César","groupes":["Rome"],"limite":null,"regne":false,"comment":"Lors des ides de Mars, Jules César  est assassiné par un groupe de sénateurs conspirateurs, dont Marcus Junius Brutus","themes":["Pouvoir et politique"]},{"label":"Révolte sicilienne","groupes":["Rome"],"limite":null,"regne":false,"comment":"Révolte entre le second triumvirat (particulièrement Octavien et Agrippa) et Sextus Pompée entre -44 et -36 se concluant par la victoire du second triumvirat","themes":["Guerres et conflits"]},{"label":"Ptolémée XV (XXXIII)","groupes":["Égypte Antique","Rome","Grèce Antique"],"limite":null,"regne":true,"comment":null,"themes":["Pouvoir et politique"]}]},{"date":"- 43","annee":-43,"evenements":[{"label":"Guerre civile de Modène","groupes":["Rome"],"limite":null,"regne":false,"comment":"Guerre civile entre l'armée du Sénat (conduite par les consuls Pansa et Hirtius accompagnés d'Octavien) contre Marc Antoine, se concluant par le repli de Marc Antoine vers le sud de la Gaule et la mort des consuls","themes":["Guerres et conflits"]},{"label":"Deuxième triumvirat","groupes":["Rome"],"limite":null,"regne":false,"comment":"Alliance politique de la Rome antique scellée à Bologne le 11 novembre -43 et rassemblant Marc Antoine, Lépide et Octave (futur Auguste).","themes":["Pouvoir et politique"]}]},{"date":"- 42","annee":-42,"evenements":[{"label":"Guerre civile des Libérateurs","groupes":["Rome"],"limite":null,"regne":false,"comment":"La guerre civile oppose le second triumvirat aux républicains. La bataille de Philippes en octobre -42 voit les triumvirs Octave et Antoine vaincre les républicains Brutus et Cassius dans la plaine à l'ouest de Philippes. Le Sénat ne peut plus préserver le régime républicain.","themes":["Guerres et conflits"]}]},{"date":"- 41","annee":-41,"evenements":[{"label":"Guerre de Pérouse","groupes":["Rome"],"limite":null,"regne":false,"comment":"La Guerre de Pérouse ou guerre civile fulvienne oppose les forces d'Octavien et de ses généraux Quintus Salvidienus Rufus et Marcus Vipsanius Agrippa aux forces de Lucius Antonius et de sa sœur, Fulvie, épouse de Marc Antoine. Elle se solde en -40 par la victoire d'Octavien.","themes":["Guerres et conflits"]}]},{"date":"- 32","annee":-32,"evenements":[{"label":"Dernière Guerre civile de la République","groupes":["Rome","Égypte Antique"],"limite":null,"regne":false,"comment":"Guerre entre Cléopâtre VII soutenue par Marc Antoine et Octavien finissant en -30. La République romaine devient progressivement un empire qui annexe l'Égypte et qui est unifié sous le règne d'Octavien, ce dernier devenant Auguste.","themes":["Pouvoir et politique","Guerres et conflits"]}]},{"date":"- 31","annee":-31,"evenements":[{"label":"Bataille d'Actium","groupes":["Rome","Égypte Antique"],"limite":null,"regne":false,"comment":"Bataille navale du 2 septembre -31, 400 navires légers, 40 000 soldats embarqués, 80 000 soldats à terre et 12 000 cavaliers césariens font face à 500 navires, dont seulement 230 en état de combattre soutenus par 80 000 soldats à terre, 20 000 embarqués et 12 000 cavaliers. Chacun des deux caps compte environ 10 000 morts mais Octave obtient victoire décisive sur les troupes de Marc-Antoine et de Cléopâtre VII, contraints de fuir en Egypte.","themes":["Guerres et conflits"]}]},{"date":"- 30","annee":-30,"evenements":[{"label":"Annexion par l'Empire romain","groupes":["Égypte Antique","Rome"],"limite":null,"regne":false,"comment":null,"themes":["Pouvoir et politique","Droit et diplomatie"]}]},{"date":"- 27","annee":-27,"evenements":[{"label":"Octave devient Auguste","groupes":["Rome"],"limite":null,"regne":true,"commen
